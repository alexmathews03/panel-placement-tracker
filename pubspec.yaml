name: drivedeck
description: CRED-styled Placement Drive & Opportunity Tracker built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  file_picker: ^12.0.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  syncfusion_flutter_pdf: ^33.2.13
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
